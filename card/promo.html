<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>👂 小耳微信清扫器 · 宣传卡片</title>
<style>
/* 同一套视觉体系：实拍卡纸资产 + t15 艺术史海报配色
   但内容策略相反——使用卡片讲「怎么做」，宣传卡片只负责「震一下 + 给个地址」 */
:root{
  --field:#2A2A28; --paper:#EFE8D8; --ink:#26221C; --ink-soft:#6E675C;
  --accent:#37517B; --gold:#C1913F; --red:#AE4B32;
  --text:#EFE8D8; --text-soft:rgba(239,232,216,.72);
  --A:file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper;
  --lift:drop-shadow(0 3px 3px rgba(0,0,0,.34)) drop-shadow(0 18px 30px rgba(0,0,0,.42));
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px; height:1500px; overflow:hidden; position:relative;
  background-color:var(--field); color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  padding:56px 60px 48px;
}
body::before{
  content:''; position:absolute; inset:0; z-index:0;
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/field-charcoal.webp);
  background-size:cover; background-position:center; filter:brightness(.9);
}
body::after{
  content:''; position:absolute; inset:0; z-index:60; pointer-events:none;
  background:radial-gradient(ellipse 116% 112% at 50% 42%,transparent 52%,rgba(0,0,0,.36) 100%);
}
.wrap{position:relative; z-index:10; height:100%; display:flex; flex-direction:column}

.brand{display:flex; align-items:center; gap:12px; margin-bottom:34px}
.brand .ear{font-size:32px}
.brand .nm{font-size:24px; font-weight:800; letter-spacing:3px}
.brand .os{
  margin-left:auto; font-size:18px; letter-spacing:2px; padding:7px 15px; font-weight:700;
  color:var(--paper); background-color:var(--red);
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-band.webp);
  background-size:100% 100%; background-blend-mode:multiply; transform:rotate(-1.4deg);
}

/* ── 主视觉：实拍纸艺照片，压进纸框里 ── */
.hero{position:relative; margin-bottom:6px}
.hero .ph{
  width:100%; height:452px; object-fit:cover; display:block;
  filter:var(--lift) saturate(.96);
}
.hero .cap{
  position:absolute; left:26px; bottom:-16px; z-index:5;
  font-size:19px; font-weight:700; padding:9px 16px; color:#2A2418;
  background-color:var(--gold);
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-band.webp);
  background-size:100% 100%; background-blend-mode:multiply;
  transform:rotate(-1.2deg); filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
}

/* ── 钩子 ── */
.hook{margin:52px 0 0}
.hook .l1{font-size:44px; font-weight:800; line-height:1.32; letter-spacing:-1px}
.hook .big{
  display:inline-block; font-size:96px; font-weight:900; line-height:1;
  color:var(--paper); padding:4px 22px 12px; margin:8px 0 4px;
  background-color:var(--red);
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-band.webp);
  background-size:100% 100%; background-blend-mode:multiply;
  transform:rotate(-1.1deg); filter:var(--lift);
}
.hook .l2{font-size:40px; font-weight:800; line-height:1.34; margin-top:16px}
.hook .l2 u{
  text-decoration:none; color:var(--gold);
  border-bottom:5px solid rgba(193,145,63,.45); padding-bottom:2px;
}
.hook .l3{font-size:26px; color:var(--text-soft); line-height:1.6; margin-top:22px}

/* ── 底：一句话 + 地址 ── */
.foot{margin-top:auto}
.one{
  font-size:25px; font-weight:700; color:var(--ink); padding:20px 26px; margin-bottom:18px;
  background-color:#FFFEFA;
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-panel.webp);
  background-size:100% 100%; background-blend-mode:multiply;
  filter:var(--lift); transform:rotate(-.5deg); line-height:1.5;
}
.one b{color:var(--accent)}
.one .sm{display:block; font-size:20px; color:var(--ink-soft); font-weight:400; margin-top:8px}
.bar{display:flex; align-items:center; gap:16px}
.bar .url{
  flex:1; font-size:27px; font-weight:900; letter-spacing:-.5px; text-align:center;
  font-family:ui-monospace,Menlo,monospace; color:var(--paper); padding:18px 20px;
  background-color:var(--accent);
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-band.webp);
  background-size:100% 100%; background-blend-mode:multiply;
  transform:rotate(.6deg); filter:var(--lift);
}
.bar .tag{
  font-size:18px; font-weight:700; color:var(--ink); padding:14px 15px; line-height:1.35;
  background-color:#E8E1CF; text-align:center;
  background-image:url(file:///Users/jane/.claude/skills/paper-collage-cardstock/assets/paper/card-tall.webp);
  background-size:100% 100%; background-blend-mode:multiply; transform:rotate(-1deg);
}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <span class="ear">👂</span><span class="nm">小 耳 出 品</span>
    <span class="os">OPEN SOURCE · 免费</span>
  </div>

  <div class="hero">
    <img class="ph" src="file:///Users/jane/Desktop/wechat-cleaner-图/试_无文字版.png">
    <span class="cap">微信替你存的，你一次都没打开过</span>
  </div>

  <div class="hook">
    <div class="l1">你的 Mac 上，微信正悄悄占着</div>
    <div class="big">154 GB</div>
    <div class="l2">而你<u>从来没见过它们</u></div>
    <div class="l3">群里收到的文件和视频，微信按月存在系统深层目录，<br>
      从不自动清理，Finder 里也翻不到。攒一年就是几十 GB。</div>
  </div>

  <div class="foot">
    <div class="one">一个工具，把它们找出来、搬到你看得见的地方、分好类。
      <span class="sm"><b>只移动，绝不删除</b> —— 删什么，你自己五分钟挑完。</span></div>
    <div class="bar">
      <div class="url">github.com/Jane-xiaoer/wechat-cleaner</div>
      <div class="tag">双击就能跑<br>也能丢给 AI</div>
    </div>
  </div>

</div>
</body>
</html>
